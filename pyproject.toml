[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "vecstudy"
version = "0.1.0"
description = "Hierarchical Clustering Vector Index — research reference implementation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.3",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vecstudy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
